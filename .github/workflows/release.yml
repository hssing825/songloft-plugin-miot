name: Release Plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 排队并逐一补发未处理的业务提交，避免连续推送或批量推送丢包。
concurrency:
  group: release-plugin
  queue: max
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugins/src/miot
          fetch-depth: 0

      - name: Checkout SDK source for contract tests
        uses: actions/checkout@v4
        with:
          repository: songloft-org/plugin-toolchain
          path: plugins/toolchain
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            plugins/src/miot/package-lock.json
            plugins/src/miot/frontend/package-lock.json

      - name: Build, verify and publish each pending commit
        working-directory: plugins/src/miot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_TOOLCHAIN_PATH: ${{ github.workspace }}/plugins/toolchain
        run: node scripts/release-plugin.mjs
